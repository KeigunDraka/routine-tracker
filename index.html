<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Routine Tracker</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f0f0f;
      color: #e8e8e8;
      min-height: 100vh;
      padding: 12px 14px 24px;
    }

    .container { max-width: 480px; margin: 0 auto; }

    /* ── 날짜 네비게이션 ── */
    .date-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }

    .nav-btn {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      color: #888;
      width: 40px; height: 40px;
      border-radius: 8px;
      font-size: 20px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }

    .nav-btn:active { background: #252525; }

    .date-center { text-align: center; flex: 1; padding: 0 8px; }

    .date-main { font-size: 17px; font-weight: 600; color: #fff; }

    .date-sub-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 2px;
    }

    .date-weekday { font-size: 12px; color: #555; }

    .today-btn {
      font-size: 11px;
      color: #40916c;
      background: #0d1f17;
      border: 1px solid #2d6a4f;
      border-radius: 10px;
      padding: 2px 8px;
      cursor: pointer;
      display: none;
    }

    .today-btn.visible { display: inline-block; }

    .section-title {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #444;
      margin-bottom: 8px;
      margin-top: 16px;
    }

    /* ── 수면 ── */
    .sleep-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .time-group {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 10px;
      padding: 9px 12px;
    }

    .time-label { font-size: 11px; color: #555; margin-bottom: 4px; display: block; }

    .time-input {
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-size: 20px;
      font-weight: 500;
      width: 100%;
      font-family: inherit;
      letter-spacing: 0.02em;
    }

    .time-input::placeholder { color: #2a2a2a; font-size: 18px; }

    .time-hint { font-size: 10px; color: #333; margin-top: 2px; }

    /* ── 루틴 ── */
    .routines { display: flex; flex-direction: column; gap: 6px; }

    .routine-item {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 10px;
      padding: 8px 12px;
      transition: border-color 0.15s, background 0.15s;
    }

    .routine-item.done {
      border-color: #2d6a4f;
      background: #0d1f17;
    }

    .routine-item.toggle-item { cursor: pointer; }

    .check-circle {
      width: 20px; height: 20px;
      border-radius: 50%;
      border: 2px solid #333;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.15s;
      cursor: pointer;
    }

    .routine-item.done .check-circle { background: #40916c; border-color: #40916c; }

    .check-circle::after {
      content: '';
      width: 4px; height: 8px;
      border: 2px solid #fff;
      border-top: none; border-left: none;
      transform: rotate(45deg) translateY(-1px);
      opacity: 0;
      transition: opacity 0.15s;
    }

    .routine-item.done .check-circle::after { opacity: 1; }

    .routine-label { font-size: 14px; color: #aaa; flex: 1; }
    .routine-item.done .routine-label { color: #e0e0e0; }

    .routine-controls {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .routine-num {
      background: #111;
      border: 1px solid #2a2a2a;
      border-radius: 6px;
      outline: none;
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      font-family: inherit;
      width: 54px;
      text-align: center;
      padding: 5px 4px;
    }

    .routine-num:focus { border-color: #40916c; }
    .routine-num::placeholder { color: #2a2a2a; }

    .routine-unit { font-size: 11px; color: #444; min-width: 20px; }
    .routine-item.done .routine-unit { color: #40916c; }

    .plus-btn {
      background: #1e2e26;
      border: 1px solid #2d6a4f;
      color: #40916c;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 700;
      font-family: inherit;
      padding: 5px 9px;
      cursor: pointer;
      white-space: nowrap;
      min-height: 30px;
    }

    .plus-btn:active { background: #243a2e; }

    /* ── 달리기 ── */
    .running-fields {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
    }

    .field-group {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 10px;
      padding: 8px 10px 6px;
    }

    .field-label { font-size: 11px; color: #555; margin-bottom: 4px; display: block; }

    .field-input {
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-size: 17px;
      font-weight: 500;
      width: 100%;
      font-family: inherit;
    }

    .field-input::placeholder { color: #2a2a2a; }
    .field-unit { font-size: 10px; color: #444; margin-top: 2px; }

    /* ── 메모 ── */
    .memo-input {
      width: 100%;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 10px;
      padding: 9px 12px;
      color: #ccc;
      font-size: 14px;
      font-family: inherit;
      resize: none;
      outline: none;
      line-height: 1.6;
    }

    .memo-input:focus { border-color: #333; }
    .memo-input::placeholder { color: #2a2a2a; }

    /* ── 버튼 ── */
    .btn-row { display: flex; gap: 8px; margin-top: 16px; }

    .btn {
      flex: 1;
      padding: 10px 8px;
      border-radius: 10px;
      border: none;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      min-height: 42px;
    }

    .btn-save { background: #40916c; color: #fff; }
    .btn-save:active { background: #357a5a; }

    .btn-report { background: #1f1a2e; color: #b094f5; border: 1px solid #3d2a6a; }
    .btn-export { background: #1a2a3a; color: #6aafd6; border: 1px solid #1e3a5f; }
    .btn-import { background: #1a1a2a; color: #8a8adc; border: 1px solid #2a2a4a; }

    /* ── 달력 ── */
    .calendar-section { margin-top: 40px; }

    .month-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .month-nav button {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      color: #666;
      width: 32px; height: 32px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
    }

    .month-label { font-size: 13px; color: #888; font-weight: 500; }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 3px;
    }

    .cal-header {
      text-align: center;
      font-size: 10px;
      color: #3a3a3a;
      padding: 4px 0 6px;
    }

    .cal-day {
      aspect-ratio: 1;
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      color: #444;
      position: relative;
      gap: 2px;
      cursor: pointer;
    }

    .cal-day:active { background: #1a1a1a; }
    .cal-day.empty { cursor: default; }

    .cal-day.has-data { color: #888; }

    .cal-day.selected { background: #1a1a1a; border: 1px solid #333; }

    .cal-day.today-marker .day-num {
      background: #40916c;
      color: #fff;
      border-radius: 50%;
      width: 22px; height: 22px;
      display: flex; align-items: center; justify-content: center;
    }

    .dots { display: flex; gap: 2px; }
    .dot { width: 3px; height: 3px; border-radius: 50%; background: #40916c; }
    .dot.run { background: #4a9eda; }

    /* ── 토스트 ── */
    .toast {
      position: fixed;
      bottom: 20px; left: 50%;
      transform: translateX(-50%) translateY(16px);
      background: #222;
      border: 1px solid #333;
      color: #bbb;
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 13px;
      opacity: 0;
      transition: all 0.2s;
      pointer-events: none;
      white-space: nowrap;
      z-index: 200;
    }

    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ── 팝업 ── */
    .popup-overlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.65);
      z-index: 100;
      align-items: flex-end;
      justify-content: center;
    }

    .popup-overlay.open { display: flex; }

    .popup {
      background: #181818;
      border: 1px solid #2a2a2a;
      border-radius: 16px 16px 0 0;
      padding: 20px 20px 32px;
      width: 100%;
      max-width: 480px;
    }

    .popup-date { font-size: 12px; color: #555; margin-bottom: 12px; }

    .popup-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      padding: 7px 0;
      border-bottom: 1px solid #1e1e1e;
    }

    .popup-row:last-child { border-bottom: none; }
    .popup-key { color: #666; }
    .popup-val { color: #ccc; text-align: right; }
    .popup-val.done { color: #52b788; }
    .popup-val.skip { color: #333; }

    .popup-close {
      margin-top: 14px;
      width: 100%;
      padding: 13px;
      background: #222;
      border: none;
      border-radius: 8px;
      color: #777;
      font-size: 14px;
      cursor: pointer;
      font-family: inherit;
    }

    /* ── 리포트 오버레이 ── */
    .report-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: #0f0f0f;
      z-index: 150;
      overflow-y: auto;
      padding: 14px 8px 32px;
    }

    .report-overlay.open { display: block; }

    .report-wrap { max-width: 480px; margin: 0 auto; }

    .report-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .report-title-wrap {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      flex: 1;
      padding: 0 10px;
    }

    .report-month-label { font-size: 26px; font-weight: 900; color: #fff; letter-spacing: -0.01em; }

    .report-subtitle { font-size: 10px; color: #555; letter-spacing: 0.18em; font-weight: 600; }

    /* 범례 */
    .rcal-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 5px 12px;
      justify-content: center;
      padding: 0 0 10px;
      font-size: 10px;
      color: #666;
    }

    .rcal-legend-item { display: flex; align-items: center; gap: 4px; }

    .rcal-dot { width: 6px; height: 6px; border-radius: 50%; }
    .dot-hs  { background: #4a9eda; }
    .dot-h   { background: #9d7cd8; }
    .dot-p   { background: #26a69a; }
    .dot-gs  { background: #66bb6a; }
    .dot-tw  { background: #f0a030; }
    .dot-run { background: #ef5350; }

    /* 달력 그리드 */
    .rcal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      border-left: 1px solid #1e1e1e;
      border-top: 1px solid #1e1e1e;
    }

    .rcal-header {
      text-align: center;
      font-size: 9px;
      color: #999;
      padding: 5px 0;
      border-right: 1px solid #1e1e1e;
      border-bottom: 1px solid #1e1e1e;
      letter-spacing: 0.05em;
    }

    .rcal-sun-hdr { color: #ef5350; }
    .rcal-sat-hdr { color: #4a6a8a; }

    .rcal-cell {
      min-height: 90px;
      padding: 3px 3px 4px;
      border-right: 1px solid #1e1e1e;
      border-bottom: 1px solid #1e1e1e;
      word-break: break-all;
    }

    .rcal-empty { background: transparent; }

    .rcal-today {
      background: #0a141f;
      border-right-color: #1e3a5f;
      border-bottom-color: #1e3a5f;
    }

    .rcal-top-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 2px;
    }

    .rcal-time-col { font-size: 7.5px; line-height: 1.35; flex: 1; min-width: 0; }

    .rcal-date { font-size: 10px; color: #777; text-align: right; line-height: 1.2; flex-shrink: 0; padding-left: 2px; }
    .rcal-dim  { font-size: 8px; color: #333; font-weight: 500; }
    .rcal-sat-cell .rcal-date { color: #4a6a8a; }
    .rcal-today-date { color: #6aafd6; font-weight: 700; }

    .rcal-row { display: flex; flex-wrap: wrap; gap: 2px; margin-bottom: 1px; line-height: 1.3; }

    .rcal-hs { font-size: 8px; color: #4a9eda; font-weight: 600; }
    .rcal-h  { font-size: 8px; color: #9d7cd8; font-weight: 600; }
    .rcal-p  { font-size: 8px; color: #26a69a; font-weight: 600; }
    .rcal-gs { font-size: 8px; color: #66bb6a; font-weight: 600; }
    .rcal-tw { font-size: 8px; color: #f0a030; font-weight: 600; }

    .rcal-run { font-size: 7.5px; color: #ef5350; margin-top: 1px; line-height: 1.3; }
    .rcal-run-inline { color: #ef5350; }

    .report-empty { text-align: center; color: #444; font-size: 14px; padding: 48px 0; }

    .report-close-btn {
      width: 100%;
      padding: 13px;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 10px;
      color: #888;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      margin-top: 16px;
    }

    .report-close-btn:active { background: #222; }

    /* ── 반응형 ── */
    @media (max-width: 360px) {
      .date-main { font-size: 15px; }
      .routine-num { width: 46px; font-size: 14px; }
      .plus-btn { font-size: 11px; padding: 5px 7px; }
      .field-input { font-size: 15px; }
      .btn { font-size: 12px; padding: 9px 6px; }
    }
  </style>
</head>
<body>
<div class="container">

  <!-- 날짜 네비게이션 -->
  <div class="date-nav">
    <button class="nav-btn" onclick="changeDay(-1)">‹</button>
    <div class="date-center">
      <div class="date-main" id="dateMain"></div>
      <div class="date-sub-row">
        <span class="date-weekday" id="dateWeekday"></span>
        <button class="today-btn" id="todayBtn" onclick="goToday()">오늘로</button>
      </div>
    </div>
    <button class="nav-btn" onclick="changeDay(1)">›</button>
  </div>

  <!-- 수면 -->
  <div class="section-title">수면</div>
  <div class="sleep-row">
    <div class="time-group">
      <span class="time-label">취침시간</span>
      <input class="time-input" id="sleepTime" type="text" inputmode="numeric"
             placeholder="23:00" maxlength="5" oninput="autoColonTime(this)">
      <div class="time-hint">전날 밤 · 24시간</div>
    </div>
    <div class="time-group">
      <span class="time-label">기상시간</span>
      <input class="time-input" id="wakeTime" type="text" inputmode="numeric"
             placeholder="05:00" maxlength="5" oninput="autoColonTime(this)">
      <div class="time-hint">24시간</div>
    </div>
  </div>

  <!-- Daily 5 -->
  <div class="section-title">Daily 5</div>
  <div class="routines" id="routineList"></div>

  <!-- 달리기 -->
  <div class="section-title">달리기</div>
  <div class="running-fields">
    <div class="field-group">
      <span class="field-label">거리</span>
      <input class="field-input" id="runKm" type="number" step="0.01" min="0" placeholder="0.00">
      <div class="field-unit">km</div>
    </div>
    <div class="field-group">
      <span class="field-label">심박수</span>
      <input class="field-input" id="runHr" type="number" min="0" placeholder="000">
      <div class="field-unit">bpm</div>
    </div>
    <div class="field-group">
      <span class="field-label">페이스</span>
      <input class="field-input" id="runPace" type="text" placeholder="6:00" inputmode="numeric" oninput="autoColonPace(this)">
      <div class="field-unit">min/km</div>
    </div>
  </div>

  <!-- 메모 -->
  <div class="section-title">메모</div>
  <textarea class="memo-input" id="memo" rows="2" placeholder="오늘의 컨디션, 특이사항..."></textarea>

  <!-- 버튼 -->
  <div class="btn-row">
    <button class="btn btn-save" onclick="saveDay()">저장</button>
    <button class="btn btn-report" onclick="showReport()">리포트</button>
    <button class="btn btn-export" onclick="exportData()">내보내기</button>
    <button class="btn btn-import" onclick="importData()">가져오기</button>
  </div>

  <!-- 달력 -->
  <div class="calendar-section">
    <div class="section-title">기록 달력</div>
    <div class="month-nav">
      <button onclick="changeMonth(-1)">‹</button>
      <span class="month-label" id="monthLabel"></span>
      <button onclick="changeMonth(1)">›</button>
    </div>
    <div class="calendar-grid" id="calendarGrid"></div>
  </div>

</div>

<div class="toast" id="toast"></div>

<div class="report-overlay" id="reportOverlay">
  <div class="report-wrap">
    <div class="report-header">
      <button class="nav-btn" onclick="changeReportMonth(-1)">‹</button>
      <div class="report-title-wrap">
        <span class="report-month-label" id="reportMonthLabel"></span>
        <span class="report-subtitle">DAILY ROUTINE</span>
      </div>
      <button class="nav-btn" onclick="changeReportMonth(1)">›</button>
    </div>
    <div id="reportBody"></div>
    <button class="report-close-btn" onclick="closeReport()">닫기</button>
  </div>
</div>

<div class="popup-overlay" id="popupOverlay" onclick="closePopup(event)">
  <div class="popup">
    <div class="popup-date" id="popupDate"></div>
    <div id="popupBody"></div>
    <button class="popup-close" onclick="closePopup()">닫기</button>
  </div>
</div>

<script>
// ── 상수 ───────────────────────────────────────────
const ROUTINES = [
  { id: 'handstand', label: '물구나무', type: 'number', unit: '초',    step: 5,  defaultVal: 20 },
  { id: 'piano',     label: '피아노',   type: 'number', unit: '페이지', step: 1,  defaultVal: 2  },
  { id: 'golf',      label: '골프 스윙', type: 'number', unit: '회',    step: 5,  defaultVal: 15 },
  { id: 'hanging',   label: '행잉',     type: 'number', unit: '초',    step: 5,  defaultVal: 20 },
  { id: 'twitter',   label: 'X 글올리기',  type: 'toggle' },
];

const DAYS   = ['일','월','화','수','목','금','토'];
const MONTHS = ['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];

// ── 상태 ───────────────────────────────────────────
const realToday  = new Date();
let selectedDate = new Date();
let values       = {};
let prefilled    = {};
let calMonth     = { y: selectedDate.getFullYear(), m: selectedDate.getMonth() };
let db           = JSON.parse(localStorage.getItem('routine_db') || '{}');
let reportMonth  = { y: new Date().getFullYear(), m: new Date().getMonth() };

// claude → twitter 마이그레이션
(function() {
  let changed = false;
  Object.values(db).forEach(rec => {
    if (rec.routines && 'claude' in rec.routines && !('twitter' in rec.routines)) {
      rec.routines.twitter = rec.routines.claude;
      delete rec.routines.claude;
      changed = true;
    }
  });
  if (changed) localStorage.setItem('routine_db', JSON.stringify(db));
})();

// ── 키 ─────────────────────────────────────────────
function dateToKey(d) {
  return d.toISOString().slice(0, 10);
}

function selectedKey() { return dateToKey(selectedDate); }
function todayKey()    { return dateToKey(realToday); }
function isViewingToday() { return selectedKey() === todayKey(); }

// ── 날짜 이동 ──────────────────────────────────────
function changeDay(delta) {
  const d = new Date(selectedDate);
  d.setDate(d.getDate() + delta);
  selectedDate = d;
  loadDate();
}

function goToday() {
  selectedDate = new Date(realToday);
  loadDate();
}

function loadDate() {
  values    = {};
  prefilled = {};
  clearForm();
  loadPrefilled();

  const saved = db[selectedKey()];
  if (saved) loadFromRecord(saved);

  updateDateDisplay();
  renderRoutines();
  renderCalendar();
}

// ── 날짜 표시 ──────────────────────────────────────
function updateDateDisplay() {
  const d = selectedDate;
  document.getElementById('dateMain').textContent =
    `${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일`;
  document.getElementById('dateWeekday').textContent = DAYS[d.getDay()] + '요일';

  const todayBtnEl = document.getElementById('todayBtn');
  if (isViewingToday()) todayBtnEl.classList.remove('visible');
  else todayBtnEl.classList.add('visible');
}

// ── 폼 초기화 ──────────────────────────────────────
function clearForm() {
  document.getElementById('sleepTime').value = '';
  document.getElementById('wakeTime').value  = '';
  document.getElementById('runKm').value     = '';
  document.getElementById('runHr').value     = '';
  document.getElementById('runPace').value   = '';
  document.getElementById('memo').value      = '';
}

// ── 전날 값 또는 기본값을 prefilled에 설정 ─────────
function loadPrefilled() {
  const key   = selectedKey();
  const dates = Object.keys(db).filter(d => d < key).sort().reverse();
  const last  = dates.length ? db[dates[0]] : null;
  ROUTINES.forEach(r => {
    if (r.type !== 'number') return;
    const v = last?.routines?.[r.id];
    prefilled[r.id] = (v !== null && v !== undefined) ? v : r.defaultVal;
  });
}

// ── 기록에서 폼 로드 ───────────────────────────────
function loadFromRecord(rec) {
  if (rec.sleepTime) document.getElementById('sleepTime').value = rec.sleepTime;
  if (rec.wakeTime)  document.getElementById('wakeTime').value  = rec.wakeTime;
  if (rec.memo)      document.getElementById('memo').value      = rec.memo;

  if (rec.routines) {
    ROUTINES.forEach(r => {
      values[r.id] = rec.routines[r.id] ?? null;
    });
  }

  if (rec.running) {
    if (rec.running.km)        document.getElementById('runKm').value   = rec.running.km;
    if (rec.running.heartRate) document.getElementById('runHr').value   = rec.running.heartRate;
    if (rec.running.pace)      document.getElementById('runPace').value = rec.running.pace;
  }
}

// ── 루틴 렌더링 ────────────────────────────────────
function renderRoutines() {
  const list = document.getElementById('routineList');
  list.innerHTML = '';

  ROUTINES.forEach(r => {
    const done = isDone(r, values[r.id]);
    const item = document.createElement('div');
    item.className = 'routine-item' + (done ? ' done' : '') + (r.type === 'toggle' ? ' toggle-item' : '');
    item.id = 'ri_' + r.id;

    const circle = `<div class="check-circle"></div>`;
    const label  = `<div class="routine-label">${r.label}</div>`;

    let controls = '';
    if (r.type === 'number') {
      const v = values[r.id] ?? prefilled[r.id] ?? '';
      const circleClickable = `<div class="check-circle" onclick="checkToggle('${r.id}')"></div>`;
      controls = `
        <div class="routine-controls">
          <input class="routine-num" id="rn_${r.id}" type="number" min="0"
            value="${v}" placeholder="${r.defaultVal}"
            oninput="onNumInput('${r.id}', this.value)">
          <span class="routine-unit">${r.unit}</span>
          <button class="plus-btn" onclick="addValue('${r.id}', ${r.step})">+${r.step}</button>
        </div>`;
      item.innerHTML = circleClickable + label + controls;
    } else {
      item.onclick = () => toggleItem(r.id);
      item.innerHTML = circle + label + controls;
    }
    list.appendChild(item);
  });
}

function isDone(r, val) {
  if (r.type === 'toggle') return !!val;
  return val !== undefined && val !== null && val !== '' && Number(val) > 0;
}

function onNumInput(id, val) {
  values[id] = val === '' ? null : Number(val);
  updateRoutineUI(id);
}

function addValue(id, step) {
  const r    = ROUTINES.find(x => x.id === id);
  const cur  = values[id];
  const base = (cur !== null && cur !== undefined && cur !== '') ? Number(cur) : (prefilled[id] ?? r.defaultVal ?? 0);
  values[id] = base + step;
  const inp = document.getElementById('rn_' + id);
  if (inp) inp.value = values[id];
  updateRoutineUI(id);
}

function updateRoutineUI(id) {
  const r    = ROUTINES.find(x => x.id === id);
  const item = document.getElementById('ri_' + id);
  if (!item) return;
  const done = isDone(r, values[id]);
  item.className = 'routine-item' + (done ? ' done' : '') + (r.type === 'toggle' ? ' toggle-item' : '');
}

function toggleItem(id) {
  values[id] = !values[id];
  updateRoutineUI(id);
}

function checkToggle(id) {
  const r   = ROUTINES.find(x => x.id === id);
  const cur = values[id];
  if (isDone(r, cur)) {
    values[id] = null;
  } else {
    values[id] = prefilled[id] ?? r.defaultVal;
  }
  const inp = document.getElementById('rn_' + id);
  if (inp) inp.value = values[id] ?? prefilled[id] ?? '';
  updateRoutineUI(id);
}

// ── 저장 ───────────────────────────────────────────
function saveDay() {
  const key = selectedKey();

  const routineData = {};
  ROUTINES.forEach(r => {
    if (r.type === 'toggle') {
      routineData[r.id] = !!values[r.id];
    } else {
      const v = values[r.id];
      routineData[r.id] = (v !== null && v !== undefined && v !== '') ? Number(v) : null;
    }
  });

  const km   = parseFloat(document.getElementById('runKm').value);
  const hr   = parseInt(document.getElementById('runHr').value);
  const pace = document.getElementById('runPace').value.trim();
  const hasRun = km || hr || pace;

  db[key] = {
    date:      key,
    sleepTime: document.getElementById('sleepTime').value || null,
    wakeTime:  document.getElementById('wakeTime').value  || null,
    routines:  routineData,
    running:   hasRun ? { km: km || null, heartRate: hr || null, pace: pace || null } : null,
    memo:      document.getElementById('memo').value.trim() || null,
  };

  localStorage.setItem('routine_db', JSON.stringify(db));
  renderCalendar();
  toast('저장했어요 ✓');
}

// ── 내보내기 ───────────────────────────────────────
function exportData() {
  const records = Object.values(db).sort((a, b) => a.date.localeCompare(b.date));
  const payload = { exported_at: new Date().toISOString(), records };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  const now  = new Date();
  a.href     = url;
  a.download = `routines_${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}.json`;
  a.click();
  URL.revokeObjectURL(url);
  toast('내보내기 완료');
}

// ── 가져오기 & 병합 ────────────────────────────────
function importData() {
  const input = document.createElement('input');
  input.type   = 'file';
  input.accept = '.json';
  input.onchange = e => {
    const file   = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const parsed  = JSON.parse(ev.target.result);
        const records = parsed.records || (Array.isArray(parsed) ? parsed : Object.values(parsed));
        let added = 0, skipped = 0;

        records.forEach(rec => {
          if (!rec.date) return;
          if (db[rec.date]) { skipped++; }
          else              { db[rec.date] = rec; added++; }
        });

        localStorage.setItem('routine_db', JSON.stringify(db));
        renderCalendar();
        toast(`${added}개 추가, ${skipped}개 중복 건너뜀`);
      } catch {
        toast('파일 형식 오류');
      }
    };
    reader.readAsText(file);
  };
  input.click();
}

// ── 24시간 시간 입력 자동 콜론 ────────────────────
function autoColonTime(input) {
  let v = input.value.replace(/\D/g, '').slice(0, 4);
  if (v.length >= 3) v = v.slice(0, 2) + ':' + v.slice(2);
  input.value = v;
}

function autoColonPace(input) {
  let v = input.value.replace(/\D/g, '').slice(0, 4);
  if (v.length >= 3) v = v.slice(0, v.length - 2) + ':' + v.slice(-2);
  input.value = v;
}

// ── 달력 ───────────────────────────────────────────
function changeMonth(delta) {
  calMonth.m += delta;
  if (calMonth.m < 0)  { calMonth.m = 11; calMonth.y--; }
  if (calMonth.m > 11) { calMonth.m = 0;  calMonth.y++; }
  renderCalendar();
}

function renderCalendar() {
  const { y, m } = calMonth;
  document.getElementById('monthLabel').textContent = `${y}년 ${MONTHS[m]}`;

  const grid = document.getElementById('calendarGrid');
  grid.innerHTML = '';

  DAYS.forEach(d => {
    const h = document.createElement('div');
    h.className = 'cal-header';
    h.textContent = d;
    grid.appendChild(h);
  });

  const firstDay    = new Date(y, m, 1).getDay();
  const daysInMonth = new Date(y, m + 1, 0).getDate();
  const selKey      = selectedKey();
  const tKey        = todayKey();

  for (let i = 0; i < firstDay; i++) {
    const empty = document.createElement('div');
    empty.className = 'cal-day empty';
    grid.appendChild(empty);
  }

  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const cell    = document.createElement('div');
    cell.className = 'cal-day'
      + (dateStr === tKey   ? ' today-marker' : '')
      + (dateStr === selKey ? ' selected' : '');

    const num = document.createElement('div');
    num.className = 'day-num';
    num.textContent = d;
    cell.appendChild(num);

    const rec = db[dateStr];
    if (rec) {
      cell.classList.add('has-data');
      const dots = document.createElement('div');
      dots.className = 'dots';
      const anyDone = ROUTINES.some(r => isDone(r, rec.routines?.[r.id]));
      if (anyDone)    { const dot = document.createElement('div'); dot.className = 'dot';     dots.appendChild(dot); }
      if (rec.running){ const dot = document.createElement('div'); dot.className = 'dot run'; dots.appendChild(dot); }
      cell.appendChild(dots);
    }

    cell.onclick = () => showPopup(dateStr);
    grid.appendChild(cell);
  }
}

// ── 팝업 ───────────────────────────────────────────
function showPopup(dateStr) {
  const rec = db[dateStr];
  const d   = new Date(dateStr + 'T00:00:00');
  document.getElementById('popupDate').textContent =
    `${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일 (${DAYS[d.getDay()]})`;

  const body = document.getElementById('popupBody');

  if (!rec) {
    body.innerHTML = '<div class="popup-row"><span class="popup-key" style="color:#444">기록 없음</span></div>';
  } else {
    let html = '';

    if (rec.sleepTime || rec.wakeTime) {
      html += `<div class="popup-row"><span class="popup-key">취침</span><span class="popup-val">${rec.sleepTime || '—'}</span></div>`;
      html += `<div class="popup-row"><span class="popup-key">기상</span><span class="popup-val">${rec.wakeTime || '—'}</span></div>`;
    }

    ROUTINES.forEach(r => {
      const val  = rec.routines?.[r.id];
      const done = isDone(r, val);
      if (r.type === 'toggle') {
        html += `<div class="popup-row"><span class="popup-key">${r.label}</span><span class="popup-val ${done ? 'done' : 'skip'}">${done ? '✓' : '—'}</span></div>`;
      } else {
        html += `<div class="popup-row"><span class="popup-key">${r.label}</span><span class="popup-val ${done ? 'done' : 'skip'}">${val != null ? val + ' ' + r.unit : '—'}</span></div>`;
      }
    });

    if (rec.running) {
      const run   = rec.running;
      const parts = [
        run.km        ? run.km + 'km'        : '',
        run.heartRate ? run.heartRate + 'bpm' : '',
        run.pace      ? run.pace + '/km'      : '',
      ].filter(Boolean).join(' · ');
      if (parts) html += `<div class="popup-row"><span class="popup-key">달리기</span><span class="popup-val done">${parts}</span></div>`;
    }

    if (rec.memo) {
      html += `<div class="popup-row" style="flex-direction:column;align-items:flex-start;gap:4px"><span class="popup-key">메모</span><span style="font-size:12px;color:#888;line-height:1.5">${rec.memo}</span></div>`;
    }

    body.innerHTML = html || '<div class="popup-row"><span class="popup-key" style="color:#444">기록 없음</span></div>';
  }

  document.getElementById('popupOverlay').classList.add('open');
}

function closePopup(e) {
  if (!e || e.target === document.getElementById('popupOverlay')) {
    document.getElementById('popupOverlay').classList.remove('open');
  }
}

// ── 토스트 ─────────────────────────────────────────
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2500);
}

// ── 리포트 ────────────────────────────────────────
function showReport() {
  reportMonth = { y: new Date().getFullYear(), m: new Date().getMonth() };
  renderReport();
  document.getElementById('reportOverlay').classList.add('open');
}

function closeReport() {
  document.getElementById('reportOverlay').classList.remove('open');
}

function changeReportMonth(delta) {
  reportMonth.m += delta;
  if (reportMonth.m < 0)  { reportMonth.m = 11; reportMonth.y--; }
  if (reportMonth.m > 11) { reportMonth.m = 0;  reportMonth.y++; }
  renderReport();
}

function renderReport() {
  const { y, m } = reportMonth;
  const MONTH_EN = ['JANUARY','FEBRUARY','MARCH','APRIL','MAY','JUNE',
                    'JULY','AUGUST','SEPTEMBER','OCTOBER','NOVEMBER','DECEMBER'];
  document.getElementById('reportMonthLabel').textContent = `${MONTH_EN[m]} ${y}`;

  const daysInMonth = new Date(y, m + 1, 0).getDate();
  const firstDay    = new Date(y, m, 1).getDay();
  const body        = document.getElementById('reportBody');
  const tKey        = todayKey();

  // 범례
  const RMETA = [
    { id: 'handstand', abbr: 'HS', dot: 'dot-hs', cls: 'rcal-hs', label: 'Handstand' },
    { id: 'hanging',   abbr: 'H',  dot: 'dot-h',  cls: 'rcal-h',  label: 'Hanging'   },
    { id: 'piano',     abbr: 'P',  dot: 'dot-p',  cls: 'rcal-p',  label: 'Piano'     },
    { id: 'golf',      abbr: 'GS', dot: 'dot-gs', cls: 'rcal-gs', label: 'Golf Swing' },
    { id: 'twitter',   abbr: 'X',  dot: 'dot-tw', cls: 'rcal-tw', label: 'X Post'    },
  ];

  let legend = '<div class="rcal-legend">';
  RMETA.forEach(r => {
    legend += `<span class="rcal-legend-item"><span class="${r.cls}">${r.abbr}</span> ${r.label}</span>`;
  });
  legend += `<span class="rcal-legend-item"><span class="rcal-run-inline">▶</span> Running Distance/Pace/HR</span>`;
  legend += '</div>';

  // 달력 그리드
  let grid = '<div class="rcal-grid">';
  ['SUN','MON','TUE','WED','THU','FRI','SAT'].forEach((d, i) => {
    const cls = i === 0 ? ' rcal-sun-hdr' : i === 6 ? ' rcal-sat-hdr' : '';
    grid += `<div class="rcal-header${cls}">${d}</div>`;
  });

  for (let i = 0; i < firstDay; i++) {
    grid += '<div class="rcal-cell rcal-empty"></div>';
  }

  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const rec     = db[dateStr];
    const isToday = dateStr === tKey;
    const isSat   = new Date(y, m, d).getDay() === 6;

    grid += `<div class="rcal-cell${isToday ? ' rcal-today' : ''}${isSat ? ' rcal-sat-cell' : ''}">`;

    // 상단 행: 취침/기상 시간(왼쪽) + 날짜(오른쪽)
    grid += '<div class="rcal-top-row">';
    grid += '<div class="rcal-time-col">';
    const sc = rec?.sleepTime ? timeDeviationColor(rec.sleepTime, 21, 0, true) : '#2a2a2a';
    const wc = rec?.wakeTime  ? timeDeviationColor(rec.wakeTime,  5, 0, false) : '#2a2a2a';
    grid += `<div style="color:${sc}">${rec?.sleepTime || '—'}</div>`;
    grid += `<div style="color:${wc}">${rec?.wakeTime  || '—'}</div>`;
    grid += '</div>';
    grid += `<div class="rcal-date${isToday ? ' rcal-today-date' : ''}">${d}</div>`;
    grid += '</div>';

    if (rec) {

      const hs = rec.routines?.handstand;
      const h  = rec.routines?.hanging;
      if (hs || h) {
        grid += '<div class="rcal-row">';
        if (hs) grid += `<span class="rcal-hs">HS${hs}</span>`;
        if (h)  grid += `<span class="rcal-h">H${h}</span>`;
        grid += '</div>';
      }

      const p  = rec.routines?.piano;
      const gs = rec.routines?.golf;
      if (p || gs) {
        grid += '<div class="rcal-row">';
        if (p)  grid += `<span class="rcal-p">P${p}</span>`;
        if (gs) grid += `<span class="rcal-gs">GS${gs}</span>`;
        grid += '</div>';
      }

      if (rec.routines?.twitter) {
        grid += `<div class="rcal-row"><span class="rcal-tw">X✓</span></div>`;
      }

      if (rec.running) {
        const km   = rec.running.km        ? `${rec.running.km}k`        : '';
        const pace = rec.running.pace      ? `${rec.running.pace}`        : '';
        const hr   = rec.running.heartRate ? `${rec.running.heartRate}♥` : '';
        const parts = [km, pace, hr].filter(Boolean).join(' ');
        if (parts) grid += `<div class="rcal-run">▶${parts}</div>`;
      }
    } else {
      grid += '<div class="rcal-row"><span class="rcal-dim">HS</span> <span class="rcal-dim">H</span></div>';
      grid += '<div class="rcal-row"><span class="rcal-dim">P</span> <span class="rcal-dim">GS</span></div>';
      grid += '<div class="rcal-row"><span class="rcal-dim">X</span></div>';
    }

    grid += '</div>';
  }

  grid += '</div>';
  body.innerHTML = legend + grid;
}

// 기준 시간 대비 편차 → green(140)~red(0) HSL 색상
// isSleep: true면 자정 이후 시간을 24시간대로 보정
function timeDeviationColor(timeStr, targetH, targetM, isSleep) {
  if (!timeStr) return '#3a3a3a';
  const p = timeStr.split(':');
  if (p.length !== 2) return '#3a3a3a';
  let h = parseInt(p[0]), mn = parseInt(p[1]);
  if (isNaN(h) || isNaN(mn)) return '#3a3a3a';
  let actual = h * 60 + mn;
  if (isSleep && h < 12) actual += 24 * 60; // 00:xx → 24:xx
  const deviation = Math.min(Math.abs(actual - (targetH * 60 + targetM)), 180);
  const hue = Math.round(140 * (1 - deviation / 60));
  return `hsl(${hue},65%,45%)`;
}

function paceToSecs(paceStr) {
  if (!paceStr) return null;
  const p = paceStr.split(':');
  if (p.length !== 2) return null;
  const m = parseInt(p[0]), s = parseInt(p[1]);
  return (isNaN(m) || isNaN(s)) ? null : m * 60 + s;
}

function secsToMinKm(totalSecs) {
  const m = Math.floor(totalSecs / 60);
  const s = Math.round(totalSecs % 60);
  return `${m}:${String(s).padStart(2,'0')}`;
}

function timeStrToMins(timeStr, isSleep) {
  if (!timeStr) return null;
  const p = timeStr.split(':');
  if (p.length !== 2) return null;
  const h = parseInt(p[0]), min = parseInt(p[1]);
  if (isNaN(h) || isNaN(min)) return null;
  let total = h * 60 + min;
  if (isSleep && h < 12) total += 24 * 60;
  return total;
}

function minsToTimeStr(totalMins) {
  const h = Math.floor(totalMins / 60) % 24;
  const mn = Math.round(totalMins % 60);
  return `${String(h).padStart(2,'0')}:${String(mn).padStart(2,'0')}`;
}
