<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>오늘의 운동 💪</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Jua&family=Nanum+Gothic:wght@400;700&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #0f0f0f;
    color: #e8e8e8;
    font-family: 'Nanum Gothic', -apple-system, sans-serif;
    min-height: 100vh;
    padding: 0 0 60px;
  }

  /* ── 헤더 ── */
  header {
    background: #141414;
    padding: 20px 16px 16px;
    text-align: center;
    border-bottom: 1px solid #222;
    position: sticky;
    top: 0;
    z-index: 10;
  }

  .header-title {
    font-family: 'Jua', sans-serif;
    font-size: 22px;
    color: #f7c948;
  }

  .header-date-row {
    display: flex;
    align-items: baseline;
    justify-content: center;
    gap: 8px;
    margin-top: 3px;
  }

  .header-date {
    font-size: 12px;
    color: #555;
  }

  .rev-badge {
    font-size: 10px;
    color: #3a3a3a;
    font-weight: 500;
  }

  .progress-bar-wrap {
    margin-top: 12px;
    background: #222;
    border-radius: 20px;
    height: 8px;
    overflow: hidden;
  }

  .progress-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, #f7c948, #ff9d00);
    border-radius: 20px;
    transition: width 0.4s ease;
  }

  .progress-label {
    font-size: 11px;
    color: #555;
    margin-top: 5px;
    text-align: right;
  }

  /* ── 컨테이너 ── */
  .container {
    max-width: 480px;
    margin: 0 auto;
    padding: 14px 14px 0;
  }

  /* ── 운동 카드 ── */
  .exercise-card {
    background: #1a1a1a;
    border-radius: 12px;
    padding: 14px 14px 12px;
    margin-bottom: 10px;
    border: 1px solid #2a2a2a;
    transition: border-color 0.2s, background 0.2s;
  }

  .exercise-card.done {
    background: #0d1f17;
    border-color: #2d6a4f;
  }

  .exercise-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 12px;
  }

  .exercise-emoji {
    font-size: 36px;
    flex-shrink: 0;
    line-height: 1;
  }

  .exercise-info { flex: 1; }

  .exercise-name {
    font-family: 'Jua', sans-serif;
    font-size: 20px;
    color: #e8e8e8;
    line-height: 1.2;
  }

  .exercise-card.done .exercise-name { color: #52b788; }

  .exercise-unit {
    font-size: 11px;
    color: #444;
    margin-top: 2px;
  }

  /* 최근 기록 힌트 */
  .recent-hint {
    font-size: 11px;
    color: #3a5a48;
    margin-top: 1px;
  }

  /* 운동 자세 설명 */
  .exercise-desc {
    font-size: 11px;
    color: #666;
    margin-top: 3px;
    line-height: 1.45;
  }

  /* 운동 자세 사진 */
  .exercise-photo-wrap {
    width: 100%;
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 10px;
    background: #0d0d0d;
  }

  .exercise-photo {
    width: 100%;
    height: auto;
    display: block;
    max-height: 220px;
    object-fit: contain;
  }

  /* 타이머 버튼 & 표시 */
  .timer-btn {
    width: 100%;
    margin-top: 8px;
    padding: 9px;
    border-radius: 8px;
    border: 1px solid #2d4a6a;
    background: #14243a;
    color: #6bcfff;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    font-family: 'Nanum Gothic', sans-serif;
    -webkit-tap-highlight-color: transparent;
  }

  .timer-btn.running {
    background: #3a1414;
    border-color: #6a2d2d;
    color: #ff8080;
  }

  .timer-display {
    text-align: center;
    font-size: 11px;
    color: #6bcfff;
    margin-top: 6px;
    min-height: 14px;
  }

  /* 인증 카드 */
  .verify-card { padding: 14px 14px; }
  .verify-card .exercise-header { margin-bottom: 0; }
  .verify-card .exercise-emoji { font-size: 32px; }
  .verify-check-btn {
    font-size: 26px;
    flex-shrink: 0;
  }

  .week-lamp-row {
    display: flex;
    justify-content: space-between;
    gap: 4px;
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid #262626;
  }

  .week-lamp-col {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    flex: 1;
  }

  .week-lamp {
    width: 100%;
    max-width: 28px;
    aspect-ratio: 1;
    border-radius: 5px;
    background: #232323;
    border: 1px solid #2e2e2e;
    transition: background 0.2s, border-color 0.2s, box-shadow 0.2s;
  }

  .week-lamp.lit {
    background: #f7c948;
    border-color: #f7c948;
    box-shadow: 0 0 8px rgba(247,201,72,0.5);
  }

  .week-lamp.today {
    border-color: #6bcfff;
  }

  .week-lamp.today.lit {
    border-color: #f7c948;
  }

  .week-lamp-label {
    font-size: 9px;
    color: #555;
  }

  .done-badge {
    font-size: 20px;
    opacity: 0;
    transition: opacity 0.3s;
  }

  .exercise-card.done .done-badge { opacity: 1; }

  /* ── 카운터 행 ── */
  .counter-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  /* 체크버튼 - 숫자 왼쪽, 크게 */
  .check-btn {
    width: 64px;
    height: 64px;
    border-radius: 14px;
    border: 2px solid #2a2a2a;
    background: #1e1e1e;
    font-size: 30px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    flex-shrink: 0;
  }

  .check-btn:active { transform: scale(0.88); }

  .exercise-card.done .check-btn {
    background: #1a3d2a;
    border-color: #40916c;
  }

  .counter-value {
    font-family: 'Jua', sans-serif;
    font-size: 54px;
    color: #f7c948;
    flex: 1;
    text-align: center;
    line-height: 1;
    transition: color 0.2s;
  }

  .exercise-card.done .counter-value { color: #52b788; }

  .timer-value {
    font-family: 'Jua', sans-serif;
    font-size: 54px;
    color: #6bcfff;
    flex: 1;
    text-align: center;
    line-height: 1;
    transition: color 0.2s;
  }

  .exercise-card.done .timer-value { color: #52b788; }

  .unit-label {
    font-size: 15px;
    color: #444;
    width: 18px;
    flex-shrink: 0;
  }

  /* +/- 버튼 묶음 */
  .pm-col {
    display: flex;
    flex-direction: column;
    gap: 4px;
    flex-shrink: 0;
  }

  .counter-btn {
    width: 52px;
    height: 46px;
    border-radius: 10px;
    border: none;
    font-size: 24px;
    font-weight: bold;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.1s;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }

  .counter-btn:active { transform: scale(0.88); }

  .btn-plus-yellow { background: #f7c948; color: #111; }
  .btn-plus-blue   { background: #6bcfff; color: #111; }
  .btn-minus       { background: #252525; color: #ff6b6b; border: 1px solid #333; }

  .exercise-card.done .btn-plus-yellow { background: #40916c; color: #fff; }
  .exercise-card.done .btn-plus-blue   { background: #40916c; color: #fff; }

  /* ── 메모 ── */
  .section-title {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #444;
    margin: 16px 0 8px;
  }

  .memo-input {
    width: 100%;
    background: #1a1a1a;
    border: 1px solid #2a2a2a;
    border-radius: 10px;
    padding: 10px 12px;
    color: #ccc;
    font-size: 14px;
    font-family: 'Nanum Gothic', sans-serif;
    resize: none;
    outline: none;
    line-height: 1.6;
  }

  .memo-input:focus { border-color: #333; }
  .memo-input::placeholder { color: #2a2a2a; }

  /* ── 버튼 행 ── */
  .btn-row {
    display: flex;
    gap: 8px;
    margin-top: 14px;
  }

  .btn {
    flex: 1;
    padding: 11px 8px;
    border-radius: 10px;
    border: none;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    font-family: 'Nanum Gothic', sans-serif;
  }

  .btn-save   { background: #40916c; color: #fff; }
  .btn-report { background: #1f1a2e; color: #b094f5; border: 1px solid #3d2a6a; }
  .btn-sm     { flex: 0.5; font-size: 11px; padding: 11px 4px; }
  .btn-export { background: #1a2a3a; color: #6aafd6; border: 1px solid #1e3a5f; }
  .btn-import { background: #1a1a2a; color: #8a8adc; border: 1px solid #2a2a4a; }

  /* ── 완료 배너 ── */
  .all-done-banner {
    display: none;
    text-align: center;
    padding: 24px 20px;
    margin-top: 8px;
  }

  .all-done-banner.show { display: block; }

  .all-done-emoji {
    font-size: 60px;
    display: block;
    margin-bottom: 8px;
  }

  .all-done-text {
    font-family: 'Jua', sans-serif;
    font-size: 22px;
    color: #f7c948;
  }

  .all-done-sub {
    font-size: 13px;
    color: #555;
    margin-top: 5px;
  }

  /* ── 토스트 ── */
  .toast {
    position: fixed;
    bottom: 20px; left: 50%;
    transform: translateX(-50%) translateY(16px);
    background: #222;
    border: 1px solid #333;
    color: #bbb;
    padding: 10px 18px;
    border-radius: 8px;
    font-size: 13px;
    opacity: 0;
    transition: all 0.2s;
    pointer-events: none;
    white-space: nowrap;
    z-index: 200;
  }

  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ── 리포트 오버레이 ── */
  .report-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: #0f0f0f;
    z-index: 150;
    overflow-y: auto;
    padding: 14px 8px 32px;
  }

  .report-overlay.open { display: block; }

  .report-wrap { max-width: 480px; margin: 0 auto; }

  /* 닫기 버튼 - 상단 */
  .report-close-btn {
    width: 100%;
    padding: 11px;
    background: #1a1a1a;
    border: 1px solid #2a2a2a;
    border-radius: 10px;
    color: #888;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    font-family: 'Nanum Gothic', sans-serif;
    margin-bottom: 14px;
  }

  .report-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }

  .nav-btn {
    background: #1a1a1a;
    border: 1px solid #2a2a2a;
    color: #888;
    width: 36px; height: 36px;
    border-radius: 8px;
    font-size: 18px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }

  .report-title-wrap {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    flex: 1;
    padding: 0 10px;
  }

  .report-month-label {
    font-size: 24px;
    font-weight: 900;
    color: #fff;
    font-family: 'Jua', sans-serif;
  }

  .report-subtitle { font-size: 10px; color: #555; letter-spacing: 0.15em; }

  /* ── 통계 카드 ── */
  .stats-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 14px;
  }

  .stat-card {
    background: #1a1a1a;
    border: 1px solid #2a2a2a;
    border-radius: 10px;
    padding: 10px 12px;
  }

  .stat-emoji { font-size: 18px; }

  .stat-name {
    font-size: 11px;
    color: #555;
    margin-top: 3px;
    margin-bottom: 6px;
  }

  /* 이번달/평생 나란히 */
  .stat-nums-row {
    display: flex;
    gap: 8px;
    align-items: flex-end;
    margin-bottom: 6px;
  }

  .stat-num-block { flex: 1; }

  .stat-num-label {
    font-size: 9px;
    color: #444;
    margin-bottom: 1px;
  }

  .stat-num-value {
    font-family: 'Jua', sans-serif;
    font-size: 20px;
    line-height: 1.1;
  }

  .stat-num-value.month-col { color: #f7c948; }
  .stat-num-value.all-col   { color: #52b788; }
  .stat-num-value.month-col.blue { color: #6bcfff; }
  .stat-num-value.all-col.blue   { color: #40916c; }

  .stat-divider {
    width: 1px;
    height: 32px;
    background: #2a2a2a;
    flex-shrink: 0;
    align-self: center;
  }

  /* 달성률 바 */
  .stat-month-row {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 2px;
  }

  .stat-bar-wrap {
    flex: 1;
    background: #252525;
    border-radius: 4px;
    height: 5px;
    overflow: hidden;
  }

  .stat-bar-fill {
    height: 100%;
    border-radius: 4px;
    background: #40916c;
    transition: width 0.4s;
  }

  .stat-pct {
    font-size: 11px;
    color: #52b788;
    min-width: 30px;
    text-align: right;
  }

  .stat-days-label {
    font-size: 9px;
    color: #444;
    margin-top: 3px;
  }

  /* ── 리포트 범례 ── */
  .rcal-legend {
    display: flex;
    flex-wrap: wrap;
    gap: 5px 12px;
    justify-content: center;
    padding: 0 0 10px;
    font-size: 10px;
    color: #666;
  }

  .rcal-legend-item { display: flex; align-items: center; gap: 4px; }

  /* ── 리포트 달력 그리드 ── */
  .rcal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    border-left: 1px solid #1e1e1e;
    border-top: 1px solid #1e1e1e;
  }

  .rcal-header {
    text-align: center;
    font-size: 9px;
    color: #999;
    padding: 5px 0;
    border-right: 1px solid #1e1e1e;
    border-bottom: 1px solid #1e1e1e;
    letter-spacing: 0.05em;
  }

  .rcal-sun-hdr { color: #ef5350; }
  .rcal-sat-hdr { color: #4a6a8a; }

  .rcal-cell {
    min-height: 80px;
    padding: 3px 3px 4px;
    border-right: 1px solid #1e1e1e;
    border-bottom: 1px solid #1e1e1e;
    word-break: break-all;
    cursor: pointer;
  }

  .rcal-cell:active { background: #1a1a1a; }
  .rcal-today { background: #0a1a0f; }

  .rcal-top-row {
    display: flex;
    justify-content: flex-end;
    margin-bottom: 2px;
  }

  .rcal-date { font-size: 10px; color: #555; line-height: 1.2; }
  .rcal-sat-cell .rcal-date { color: #4a6a8a; }
  .rcal-today-date { color: #52b788; font-weight: 700; }

  .rcal-row { display: flex; flex-wrap: wrap; gap: 2px; margin-bottom: 1px; }
  .rcal-dim { font-size: 7.5px; color: #2a2a2a; font-weight: 600; }

  .rcal-pu { font-size: 7.5px; color: #f7c948; font-weight: 600; }
  .rcal-sq { font-size: 7.5px; color: #ff9d6b; font-weight: 600; }
  .rcal-lr { font-size: 7.5px; color: #b094f5; font-weight: 600; }
  .rcal-sm { font-size: 7.5px; color: #66bb6a; font-weight: 600; }
  .rcal-hg { font-size: 7.5px; color: #6bcfff; font-weight: 600; }

  .rcal-s1  { font-size: 7.5px; color: #4a9eda; font-weight: 600; }
  .rcal-s2  { font-size: 7.5px; color: #26a69a; font-weight: 600; }
  .rcal-s3  { font-size: 7.5px; color: #9d7cd8; font-weight: 600; }
  .rcal-s4  { font-size: 7.5px; color: #ef5350; font-weight: 600; }
  .rcal-s5  { font-size: 7.5px; color: #f0a030; font-weight: 600; }
  .rcal-s6  { font-size: 7.5px; color: #52d9c0; font-weight: 600; }
  .rcal-s7  { font-size: 7.5px; color: #ff8fb1; font-weight: 600; }
  .rcal-s8  { font-size: 7.5px; color: #8bc34a; font-weight: 600; }
  .rcal-s9  { font-size: 7.5px; color: #64b5f6; font-weight: 600; }
  .rcal-s10 { font-size: 7.5px; color: #ba68c8; font-weight: 600; }
  .rcal-nk  { font-size: 7.5px; color: #ffca28; font-weight: 600; }
  .rcal-vf  { font-size: 8px; }

  .rcal-memo { font-size: 7px; color: #3a3a3a; margin-top: 1px; overflow: hidden; max-height: 18px; line-height: 1.3; }

  /* 전달 날짜 (첫 주 채우기) */
  .rcal-prev-date  { color: #666; }

  /* ── 팝업 ── */
  .popup-overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.65);
    z-index: 160;
    align-items: flex-end;
    justify-content: center;
  }

  .popup-overlay.open { display: flex; }

  .popup {
    background: #181818;
    border: 1px solid #2a2a2a;
    border-radius: 16px 16px 0 0;
    padding: 20px 20px 32px;
    width: 100%;
    max-width: 480px;
  }

  .popup-date { font-size: 12px; color: #555; margin-bottom: 12px; }

  .popup-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 14px;
    padding: 7px 0;
    border-bottom: 1px solid #1e1e1e;
  }

  .popup-row:last-child { border-bottom: none; }
  .popup-key { color: #666; }
  .popup-val { color: #ccc; text-align: right; }
  .popup-val.done { color: #52b788; }
  .popup-val.skip { color: #333; }

  .popup-close {
    margin-top: 14px;
    width: 100%;
    padding: 13px;
    background: #222;
    border: none;
    border-radius: 8px;
    color: #777;
    font-size: 14px;
    cursor: pointer;
    font-family: 'Nanum Gothic', sans-serif;
  }
</style>
</head>
<body>

<!-- 헤더 -->
<header>
  <div class="header-title">오늘의 운동 💪</div>
  <div class="header-date-row">
    <span class="header-date" id="headerDate"></span>
    <span class="rev-badge">rev.3-2608</span>
  </div>
  <div class="progress-bar-wrap">
    <div class="progress-bar-fill" id="progressFill" style="width:0%"></div>
  </div>
  <div class="progress-label" id="progressLabel">0 / 17 완료</div>
</header>

<div class="container" id="mainCards"></div>

<!-- 메인 하단 -->
<div class="container">
  <div class="section-title">메모</div>
  <textarea class="memo-input" id="memo" rows="2" placeholder="오늘 운동 어땠어?"></textarea>

  <div class="btn-row">
    <button class="btn btn-save" onclick="saveDay()">저장</button>
    <button class="btn btn-report" onclick="showReport()">리포트</button>
    <button class="btn btn-sm btn-export" onclick="exportData()">내보내기</button>
    <button class="btn btn-sm btn-import" onclick="importData()">가져오기</button>
  </div>

  <div class="all-done-banner" id="allDoneBanner">
    <span class="all-done-emoji">🎉</span>
    <div class="all-done-text">오늘 운동 완료!</div>
    <div class="all-done-sub">최고야! 내일도 하자 💪</div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- 리포트 오버레이 -->
<div class="report-overlay" id="reportOverlay">
  <div class="report-wrap">
    <!-- 닫기 버튼 상단 -->
    <button class="report-close-btn" onclick="closeReport()">✕ 닫기</button>

    <div class="report-header">
      <button class="nav-btn" onclick="changeReportMonth(-1)">‹</button>
      <div class="report-title-wrap">
        <span class="report-month-label" id="reportMonthLabel"></span>
        <span class="report-subtitle">WORKOUT</span>
      </div>

const DAYS      = ['일','월','화','수','목','금','토'];
const MONTHS_EN = ['JANUARY','FEBRUARY','MARCH','APRIL','MAY','JUNE','JULY','AUGUST','SEPTEMBER','OCTOBER','NOVEMBER','DECEMBER'];
const DB_KEY    = 'kids_workout_db';

// ── 상태 ──────────────────────────────────────────
let db          = JSON.parse(localStorage.getItem(DB_KEY) || '{}');
let todayVals   = {};   // { exerciseId: number }  0/미기재 = 미완료
let recentVals  = {};   // 가장 최근 기록값 (체크버튼 기본값)
let verified    = false; // 오늘 인증 여부
let reportMonth = { y: new Date().getFullYear(), m: new Date().getMonth() };

// ── 레거시 배열 데이터 → id 기반 객체로 변환 ───────
const LEGACY_ORDER = ['pushup','squat','legraise','superman','hang'];
function normalizeRecord(rec) {
  if (!rec) return rec;
  if (!rec.vals) {
    const vals = {};
    if (Array.isArray(rec.values)) {
      LEGACY_ORDER.forEach((id, i) => { vals[id] = rec.values[i] || 0; });
    }
    rec.vals = vals;
  }
  if (rec.verified === undefined) rec.verified = false;
  return rec;
}

// ── 날짜 유틸 ─────────────────────────────────────
function todayKey() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function todayStr() {
  return new Date().toLocaleDateString('ko-KR', { year:'numeric', month:'long', day:'numeric', weekday:'long' });
}

// ── 이번 주(일~토) 인증 현황 ───────────────────────
function getWeekVerifyStatus() {
  const now = new Date();
  const dow = now.getDay(); // 0=일 ... 6=토
  const sunday = new Date(now);
  sunday.setDate(now.getDate() - dow);

  const result = [];
  for (let i = 0; i < 7; i++) {
    const d = new Date(sunday);
    d.setDate(sunday.getDate() + i);
    const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    const isToday = key === todayKey();
    const rec = normalizeRecord(db[key]);
    const isVerified = isToday ? verified : !!(rec && rec.verified);
    const isFuture = d > now && !isToday;
    result.push({ label: DAYS[i], verified: isVerified, isToday, isFuture });
  }
  return result;
}

// ── 최근 기록 로드 ────────────────────────────────
function loadRecentVals() {
  const key     = todayKey();
  const allKeys = Object.keys(db).filter(k => k < key).sort().reverse();
  recentVals = {};
  if (allKeys.length > 0) {
    const last = normalizeRecord(db[allKeys[0]]);
    recentVals = { ...(last.vals || {}) };
  }
}

// ── 로드 ──────────────────────────────────────────
// ── 음성 타이머 (TTS) ─────────────────────────────
let activeTimer = null; // { exId, seconds, targetHit, intervalId }

function speak(text) {
  try {
    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = 'ko-KR';
    utter.rate = 1.0;
    window.speechSynthesis.speak(utter);
  } catch (e) { /* TTS 미지원 브라우저는 조용히 무시 */ }
}

// 1~99 한글 숫자 읽기 (순우리말 수)
const KOR_NUM = ['','일','이','삼','사','오','육','칠','팔','구'];
const KOR_TEN = ['','십','이십','삼십','사십','오십','육십','칠십','팔십','구십'];
function toKoreanNumber(n) {
  if (n <= 0) return '영';
  if (n < 10) return KOR_NUM[n];
  const tens = Math.floor(n / 10);
  const ones = n % 10;
  return KOR_TEN[tens] + KOR_NUM[ones];
}

function startExerciseTimer(exId) {
  // 이미 실행 중인 타이머가 있으면 중지
  if (activeTimer) {
    stopExerciseTimer();
    return;
  }

  const ex = EXERCISES.find(e => e.id === exId);
  const target = todayVals[exId] || recentVals[exId] || ex.step || 5;

  const btn  = document.getElementById(`timerbtn-${exId}`);
  const disp = document.getElementById(`timerdisp-${exId}`);
  if (btn) { btn.textContent = '■ 정지'; btn.classList.add('running'); }
  if (disp) disp.textContent = `목표 ${target}초 · 5초 뒤 시작합니다...`;

  activeTimer = { exId, seconds: 0, targetHit: false, intervalId: null, countdownId: null, target };

  speak('5초 뒤에 시작합니다.');

  // 5,4,3,2,1 카운트다운 (1초 간격)
  let cd = 5;
  const countdownId = setInterval(() => {
    if (!activeTimer || activeTimer.exId !== exId) { clearInterval(countdownId); return; }
    if (disp) disp.textContent = `${cd}... (목표 ${target}초)`;
    speak(String(cd));
    cd--;
    if (cd <= 0) {
      clearInterval(countdownId);
      speak('시작');
      if (disp) disp.textContent = `0초 진행 중...`;

      activeTimer.intervalId = setInterval(() => {
        if (!activeTimer || activeTimer.exId !== exId) return;
        activeTimer.seconds += 1;
        const s = activeTimer.seconds;

        if (!activeTimer.targetHit && s >= activeTimer.target) {
          activeTimer.targetHit = true;
          speak('성공!');
          if (disp) disp.textContent = `🎉 성공! ${s}초 진행 중 (계속)`;
        } else {
          speak(toKoreanNumber(s));
          if (disp) disp.textContent = `${s}초 진행 중...`;
        }
      }, 1000);
    }
  }, 1000);

  activeTimer.countdownId = countdownId;
}

function stopExerciseTimer() {
  if (!activeTimer) return;
  const { exId, intervalId, countdownId } = activeTimer;
  clearInterval(countdownId);
  clearInterval(intervalId);
  window.speechSynthesis.cancel();

  const btn  = document.getElementById(`timerbtn-${exId}`);
  const disp = document.getElementById(`timerdisp-${exId}`);
  if (btn) { btn.textContent = '▶ 타이머'; btn.classList.remove('running'); }
  if (disp) disp.textContent = '';

  activeTimer = null;
}

function load() {
  loadRecentVals();
  const key   = todayKey();
  const saved = normalizeRecord(db[key]);
  todayVals = saved ? { ...(saved.vals || {}) } : {};
  verified  = saved ? !!saved.verified : false;
  document.getElementById('memo').value = saved?.memo || '';
  renderCards();
  renderProgress();
}

// ── 즉시 저장 (내부) ──────────────────────────────
function persist() {
  const key = todayKey();
  if (!db[key]) db[key] = { date: key, vals: {}, verified: false, memo: null };
  db[key].vals     = { ...todayVals };
  db[key].verified = verified;
  delete db[key].values; // 레거시 필드 정리
  localStorage.setItem(DB_KEY, JSON.stringify(db));
}

// ── 저장 버튼 (메모 포함) ─────────────────────────
function saveDay() {
  persist();
  const key = todayKey();
  db[key].memo = document.getElementById('memo').value.trim() || null;
  localStorage.setItem(DB_KEY, JSON.stringify(db));
  toast('저장했어요 ✓');
}

// ── 카운터 변경 ───────────────────────────────────
function changeCount(id, delta) {
  const cur = todayVals[id] || 0;
  todayVals[id] = Math.max(0, cur + delta);
  persist();
  renderCards();
  renderProgress();
}

// ── 체크버튼: 최근값으로 토글 ────────────────────
function checkToggle(id) {
  const ex = EXERCISES.find(e => e.id === id);
  if ((todayVals[id] || 0) > 0) {
    // 이미 했으면 → 0으로 (취소)
    todayVals[id] = 0;
  } else {
    // 안 했으면 → 최근값으로 채우기
    todayVals[id] = recentVals[id] || (ex && ex.step) || 1;
  }
  persist();
  renderCards();
  renderProgress();
}

// ── 인증 토글 ─────────────────────────────────────
function toggleVerify() {
  verified = !verified;
  persist();
  renderCards();
  renderProgress();
}

// ── 카드 렌더링 ───────────────────────────────────
function renderCards() {
  const container = document.getElementById('mainCards');
  container.innerHTML = '';

  EXERCISES.forEach(ex => {
    const v      = todayVals[ex.id] || 0;
    const done   = v > 0;
    const isTime = !!ex.isTime;
    const recent = recentVals[ex.id] || 0;
    const step   = ex.step || 1;

    const card = document.createElement('div');
    card.className = 'exercise-card' + (done ? ' done' : '');
    card.id = `card-${ex.id}`;

    const recentHint = recent > 0
      ? `<div class="recent-hint">최근: ${recent}${ex.unit}</div>`
      : '';

    const descHint = ex.desc
      ? `<div class="exercise-desc">${ex.desc}</div>`
      : '';

    const checkEmoji = done ? '✅' : '⬜';
    const valueClass = isTime ? 'timer-value' : 'counter-value';
    const plusClass  = isTime ? 'btn-plus-blue' : 'btn-plus-yellow';

    const imgSrc = ex.imgKey ? EX_IMG[ex.imgKey] : null;
    const imgHTML = imgSrc ? `<div class="exercise-photo-wrap"><img class="exercise-photo" src="${imgSrc}" alt="${ex.label}"></div>` : '';

    const timerBtnHTML = isTime
      ? `<button class="timer-btn" id="timerbtn-${ex.id}" onclick="startExerciseTimer('${ex.id}')">▶ 타이머</button>`
      : '';
    const timerRowHTML = isTime
      ? `<div class="timer-display" id="timerdisp-${ex.id}"></div>`
      : '';

    card.innerHTML = `
      ${imgHTML}
      <div class="exercise-header">
        <div class="exercise-emoji">${ex.emoji}</div>
        <div class="exercise-info">
          <div class="exercise-name">${ex.label}</div>
          ${descHint}
          ${recentHint}
        </div>
        <div class="done-badge">✅</div>
      </div>
      <div class="counter-row">
        <button class="check-btn" onclick="checkToggle('${ex.id}')">${checkEmoji}</button>
        <span class="${valueClass}" id="val-${ex.id}">${v}</span>
        <span class="unit-label">${ex.unit}</span>
        <div class="pm-col">
          <button class="counter-btn ${plusClass}" onclick="changeCount('${ex.id}',${step})">+${step}</button>
          <button class="counter-btn btn-minus" onclick="changeCount('${ex.id}',-${step})">−</button>
        </div>
      </div>
      ${timerBtnHTML}
      ${timerRowHTML}`;

    container.appendChild(card);
  });

  // 재렌더링 시 실행 중인 타이머 UI 상태 복원
  if (activeTimer) {
    const btn  = document.getElementById(`timerbtn-${activeTimer.exId}`);
    const disp = document.getElementById(`timerdisp-${activeTimer.exId}`);
    if (btn) { btn.textContent = '■ 정지'; btn.classList.add('running'); }
    if (disp) {
      if (activeTimer.intervalId) {
        disp.textContent = activeTimer.targetHit
          ? `🎉 성공! ${activeTimer.seconds}초 진행 중 (계속)`
          : `${activeTimer.seconds}초 진행 중...`;
      } else {
        disp.textContent = `목표 ${activeTimer.target}초 · 5초 뒤 시작합니다...`;
      }
    }
  }

  // ── 인증 카드 (카메라 아이콘, 완료 토글만) ──
  const vCard = document.createElement('div');
  vCard.className = 'exercise-card verify-card' + (verified ? ' done' : '');
  vCard.id = 'card-verify';

  const weekStatus = getWeekVerifyStatus();
  const lampsHTML = weekStatus.map(w => {
    let cls = 'week-lamp';
    if (w.verified) cls += ' lit';
    if (w.isToday)  cls += ' today';
    return `<div class="week-lamp-col"><div class="${cls}"></div><span class="week-lamp-label">${w.label}</span></div>`;
  }).join('');

  vCard.innerHTML = `
    <div class="exercise-header" onclick="toggleVerify()" style="cursor:pointer">
      <div class="exercise-emoji">${VERIFY.emoji}</div>
      <div class="exercise-info">
        <div class="exercise-name">${VERIFY.label}</div>
        <div class="exercise-desc">${VERIFY.desc}</div>
      </div>
      <div class="verify-check-btn">${verified ? '✅' : '⬜'}</div>
    </div>
    <div class="week-lamp-row">${lampsHTML}</div>`;
  container.appendChild(vCard);
}

// ── 프로그레스 렌더링 ─────────────────────────────
function renderProgress() {
  const total = EXERCISES.length;
  let doneCount = EXERCISES.filter(ex => (todayVals[ex.id] || 0) > 0).length;
  const pct = Math.round(doneCount / total * 100);
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressLabel').textContent = `${doneCount} / ${total} 완료`;
  document.getElementById('headerDate').textContent = todayStr();

  const banner = document.getElementById('allDoneBanner');
  if (doneCount === total && verified) banner.classList.add('show');
  else                                 banner.classList.remove('show');
}

// ── 리포트 ────────────────────────────────────────
function showReport() {
  reportMonth = { y: new Date().getFullYear(), m: new Date().getMonth() };
  renderReport();
  document.getElementById('reportOverlay').classList.add('open');
}

function closeReport() {
  document.getElementById('reportOverlay').classList.remove('open');
}

function changeReportMonth(delta) {
  reportMonth.m += delta;
  if (reportMonth.m < 0)  { reportMonth.m = 11; reportMonth.y--; }
  if (reportMonth.m > 11) { reportMonth.m = 0;  reportMonth.y++; }
  renderReport();
}

function renderReport() {
  const { y, m } = reportMonth;
  document.getElementById('reportMonthLabel').textContent = `${MONTHS_EN[m]} ${y}`;

  const daysInMonth = new Date(y, m+1, 0).getDate();
  const firstDay    = new Date(y, m, 1).getDay();
  const tKey        = todayKey();
  const monthPrefix = `${y}-${String(m+1).padStart(2,'0')}`;

  // ── 통계 계산 ──
  let monthSums = {}, monthDays = {}, allSums = {};
  EXERCISES.forEach(ex => { monthSums[ex.id] = 0; monthDays[ex.id] = 0; allSums[ex.id] = 0; });
  let verifiedMonthDays = 0;

  Object.entries(db).forEach(([key, rec0]) => {
    const rec = normalizeRecord(rec0);
    if (!rec.vals) return;
    EXERCISES.forEach(ex => {
      const v = rec.vals[ex.id] || 0;
      if (v > 0) {
        allSums[ex.id] += v;
        if (key.startsWith(monthPrefix)) {
          monthSums[ex.id] += v;
          monthDays[ex.id]++;
        }
      }
    });
    if (rec.verified && key.startsWith(monthPrefix)) verifiedMonthDays++;
  });

  const nowY = new Date().getFullYear(), nowM = new Date().getMonth();
  const isCurrentMonth = (y === nowY && m === nowM);
  const elapsedDays    = isCurrentMonth ? new Date().getDate() : daysInMonth;

  // ── 통계 카드 ──
  let statsHTML = '<div class="stats-grid">';
  EXERCISES.forEach(ex => {
    const pct    = elapsedDays > 0 ? Math.round(monthDays[ex.id] / elapsedDays * 100) : 0;
    const isTime = !!ex.isTime;
    const blue   = isTime ? ' blue' : '';

    function fmtVal(n) {
      if (!isTime) return n.toLocaleString() + ex.unit;
      if (n >= 60) return `${Math.floor(n/60)}분 ${n%60}초`;
      return n + '초';
    }

    statsHTML += `
      <div class="stat-card">
        <div class="stat-emoji">${ex.emoji}</div>
        <div class="stat-name">${ex.label}</div>
        <div class="stat-nums-row">
          <div class="stat-num-block">
            <div class="stat-num-label">이번달</div>
            <div class="stat-num-value month-col${blue}">${fmtVal(monthSums[ex.id])}</div>
          </div>
          <div class="stat-divider"></div>
          <div class="stat-num-block">
            <div class="stat-num-label">평생 한 횟수</div>
            <div class="stat-num-value all-col${blue}">${fmtVal(allSums[ex.id])}</div>
          </div>
        </div>
        <div class="stat-month-row">
          <div class="stat-bar-wrap">
            <div class="stat-bar-fill" style="width:${pct}%"></div>
          </div>
          <span class="stat-pct">${pct}%</span>
        </div>
        <div class="stat-days-label">이번달 ${monthDays[ex.id]}일 실행 / ${elapsedDays}일</div>
      </div>`;
  });

  // 인증 통계 카드
  const vPct = elapsedDays > 0 ? Math.round(verifiedMonthDays / elapsedDays * 100) : 0;
  statsHTML += `
    <div class="stat-card">
      <div class="stat-emoji">${VERIFY.emoji}</div>
      <div class="stat-name">${VERIFY.label}</div>
      <div class="stat-month-row" style="margin-top:22px">
        <div class="stat-bar-wrap">
          <div class="stat-bar-fill" style="width:${vPct}%"></div>
        </div>
        <span class="stat-pct">${vPct}%</span>
      </div>
      <div class="stat-days-label">이번달 ${verifiedMonthDays}일 인증 / ${elapsedDays}일</div>
    </div>`;
  statsHTML += '</div>';

  // ── 범례 ──
  let legend = '<div class="rcal-legend">';
  EXERCISES.forEach(ex => {
    legend += `<span class="rcal-legend-item"><span class="${ex.cls}">${ex.abbr}</span> ${ex.label}</span>`;
  });
  legend += `<span class="rcal-legend-item"><span class="rcal-vf">${VERIFY.emoji}</span> ${VERIFY.label}</span>`;
  legend += '</div>';

  // ── 이전 달 정보 (첫 주 채우기용) ──
  const prevMonthDate  = new Date(y, m, 0); // 이전 달 마지막 날
  const prevY          = prevMonthDate.getFullYear();
  const prevM          = prevMonthDate.getMonth();
  const prevDaysInMonth= prevMonthDate.getDate();

  function renderCellContent(dateStr, rec0) {
    const rec = normalizeRecord(rec0);
    let html = '';
    if (rec && rec.vals) {
      const doneList = EXERCISES.filter(ex => (rec.vals[ex.id] || 0) > 0);
      // 4개씩 묶어서 행으로 표시
      for (let i = 0; i < doneList.length; i += 4) {
        html += '<div class="rcal-row">';
        doneList.slice(i, i + 4).forEach(ex => {
          const val = rec.vals[ex.id];
          html += `<span class="${ex.cls}">${ex.abbr}${val}</span>`;
        });
        html += '</div>';
      }
      if (rec.verified) html += `<div class="rcal-row"><span class="rcal-vf">${VERIFY.emoji}</span></div>`;
      if (rec.memo) html += `<div class="rcal-memo">${rec.memo}</div>`;
    } else {
      html += '<div class="rcal-row"><span class="rcal-dim">기록없음</span></div>';
    }
    return html;
  }

  // ── 달력 그리드 ──
  let grid = '<div class="rcal-grid">';
  ['SUN','MON','TUE','WED','THU','FRI','SAT'].forEach((d,i) => {
    const cls = i===0 ? ' rcal-sun-hdr' : i===6 ? ' rcal-sat-hdr' : '';
    grid += `<div class="rcal-header${cls}">${d}</div>`;
  });

  // 첫 주 빈칸 → 전달 마지막 날짜들로 채움
  for (let i = 0; i < firstDay; i++) {
    const pd = prevDaysInMonth - firstDay + 1 + i;
    const dateStr = `${prevY}-${String(prevM+1).padStart(2,'0')}-${String(pd).padStart(2,'0')}`;
    const rec = db[dateStr];
    grid += `<div class="rcal-cell" onclick="showPopup('${dateStr}')">`;
    grid += `<div class="rcal-top-row"><span class="rcal-date rcal-prev-date">${pd}</span></div>`;
    grid += renderCellContent(dateStr, rec);
    grid += '</div>';
  }

  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const rec     = db[dateStr];
    const isToday = dateStr === tKey;
    const isSat   = new Date(y, m, d).getDay() === 6;

    grid += `<div class="rcal-cell${isToday?' rcal-today':''}${isSat?' rcal-sat-cell':''}" onclick="showPopup('${dateStr}')">`;
    grid += `<div class="rcal-top-row"><span class="rcal-date${isToday?' rcal-today-date':''}">${d}</span></div>`;
    grid += renderCellContent(dateStr, rec);
    grid += '</div>';
  }
  grid += '</div>';

  document.getElementById('reportBody').innerHTML = statsHTML + legend + grid;
}

// ── 팝업 ──────────────────────────────────────────
function showPopup(dateStr) {
  const rec = db[dateStr];
  const d   = new Date(dateStr + 'T00:00:00');
  document.getElementById('popupDate').textContent =
    `${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일 (${DAYS[d.getDay()]})`;

  const body = document.getElementById('popupBody');
  const nrec = normalizeRecord(rec);
  if (!nrec || !nrec.vals) {
    body.innerHTML = '<div class="popup-row"><span class="popup-key" style="color:#333">기록 없음</span></div>';
  } else {
    let html = '';
    EXERCISES.forEach(ex => {
      const v    = nrec.vals[ex.id] || 0;
      const done = v > 0;
      html += `<div class="popup-row">
        <span class="popup-key">${ex.emoji} ${ex.label}</span>
        <span class="popup-val ${done?'done':'skip'}">${done ? v+' '+ex.unit : '—'}</span>
      </div>`;
    });
    html += `<div class="popup-row">
      <span class="popup-key">${VERIFY.emoji} ${VERIFY.label}</span>
      <span class="popup-val ${nrec.verified?'done':'skip'}">${nrec.verified ? '✓' : '—'}</span>
    </div>`;
    if (nrec.memo) {
      html += `<div class="popup-row" style="flex-direction:column;align-items:flex-start;gap:4px">
        <span class="popup-key">메모</span>
        <span style="font-size:12px;color:#888;line-height:1.5">${nrec.memo}</span>
      </div>`;
    }
    body.innerHTML = html;
  }
  document.getElementById('popupOverlay').classList.add('open');
}

function closePopup(e) {
  if (!e || e.target === document.getElementById('popupOverlay')) {
    document.getElementById('popupOverlay').classList.remove('open');
  }
}

// ── 토스트 ────────────────────────────────────────
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2000);
}

// ── 내보내기 ──────────────────────────────────────
function exportData() {
  const records = Object.values(db).sort((a, b) => a.date.localeCompare(b.date));
  const payload = { exported_at: new Date().toISOString(), records };
  const blob    = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const url     = URL.createObjectURL(blob);
  const a       = document.createElement('a');
  const now     = new Date();
  a.href        = url;
  a.download    = `kids_workout_${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}.json`;
  a.click();
  URL.revokeObjectURL(url);
  toast('내보내기 완료 ✓');
}

// ── 가져오기 ──────────────────────────────────────
function importData() {
  const input  = document.createElement('input');
  input.type   = 'file';
  input.accept = '.json';
  input.onchange = e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const parsed  = JSON.parse(ev.target.result);
        const records = parsed.records || (Array.isArray(parsed) ? parsed : Object.values(parsed));
        let added = 0, skipped = 0;
        records.forEach(rec => {
          if (!rec.date) return;
          if (db[rec.date]) skipped++;
          else { db[rec.date] = rec; added++; }
        });
        localStorage.setItem(DB_KEY, JSON.stringify(db));
        toast(`${added}개 추가, ${skipped}개 중복 건너뜀`);
      } catch {
        toast('파일 형식 오류');
      }
    };
    reader.readAsText(file);
  };
  input.click();
}

// ── 시작 ──────────────────────────────────────────
load();
