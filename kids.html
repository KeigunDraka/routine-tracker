<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>오늘의 운동 💪</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Jua&family=Nanum+Gothic:wght@400;700&display=swap');

  :root {
    --bg: #0f1117;
    --card: #1a1d27;
    --card2: #21253a;
    --accent: #f7c948;
    --accent2: #ff6b6b;
    --accent3: #6bcfff;
    --text: #f0f0f0;
    --muted: #888;
    --done-bg: #1a2e1a;
    --done-border: #4caf50;
    --done-text: #81c784;
    --radius: 18px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Nanum Gothic', sans-serif;
    min-height: 100vh;
    padding: 0 0 40px;
  }

  header {
    background: linear-gradient(135deg, #1a1d27 0%, #21253a 100%);
    padding: 24px 20px 20px;
    text-align: center;
    border-bottom: 2px solid #2a2e42;
    position: sticky;
    top: 0;
    z-index: 10;
  }

  .header-title {
    font-family: 'Jua', sans-serif;
    font-size: 26px;
    color: var(--accent);
    letter-spacing: -0.5px;
  }

  .header-date {
    font-size: 13px;
    color: var(--muted);
    margin-top: 4px;
  }

  .progress-bar-wrap {
    margin-top: 14px;
    background: #2a2e42;
    border-radius: 20px;
    height: 10px;
    overflow: hidden;
  }

  .progress-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent) 0%, #ff9d00 100%);
    border-radius: 20px;
    transition: width 0.4s ease;
  }

  .progress-label {
    font-size: 12px;
    color: var(--muted);
    margin-top: 6px;
    text-align: right;
  }

  .container {
    max-width: 480px;
    margin: 0 auto;
    padding: 16px 16px 0;
  }

  .exercise-card {
    background: var(--card);
    border-radius: var(--radius);
    padding: 18px 16px;
    margin-bottom: 12px;
    border: 1.5px solid #2a2e42;
    transition: all 0.3s ease;
  }

  .exercise-card.done {
    background: var(--done-bg);
    border-color: var(--done-border);
  }

  .exercise-card.done .exercise-name {
    color: var(--done-text);
  }

  .exercise-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 14px;
  }

  .exercise-emoji {
    font-size: 28px;
    flex-shrink: 0;
  }

  .exercise-info {
    flex: 1;
  }

  .exercise-name {
    font-family: 'Jua', sans-serif;
    font-size: 20px;
    color: var(--text);
    line-height: 1.2;
  }

  .exercise-unit {
    font-size: 12px;
    color: var(--muted);
    margin-top: 2px;
  }

  .done-badge {
    font-size: 22px;
    opacity: 0;
    transition: opacity 0.3s;
  }

  .exercise-card.done .done-badge {
    opacity: 1;
  }

  .counter-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }

  .counter-btn {
    width: 56px;
    height: 56px;
    border-radius: 14px;
    border: none;
    font-size: 26px;
    font-weight: bold;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.1s, opacity 0.2s;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }

  .counter-btn:active {
    transform: scale(0.92);
  }

  .btn-minus {
    background: #2a2e42;
    color: var(--accent2);
  }

  .btn-plus {
    background: var(--accent);
    color: #111;
  }

  .exercise-card.done .btn-plus {
    background: var(--done-border);
  }

  .counter-value {
    font-family: 'Jua', sans-serif;
    font-size: 52px;
    color: var(--accent);
    min-width: 90px;
    text-align: center;
    line-height: 1;
    transition: color 0.3s;
  }

  .exercise-card.done .counter-value {
    color: var(--done-text);
  }

  .unit-label {
    font-size: 16px;
    color: var(--muted);
    min-width: 28px;
    text-align: left;
  }

  /* Timer specific */
  .timer-display {
    font-family: 'Jua', sans-serif;
    font-size: 52px;
    color: var(--accent3);
    min-width: 110px;
    text-align: center;
    line-height: 1;
    transition: color 0.3s;
  }

  .exercise-card.done .timer-display {
    color: var(--done-text);
  }

  .btn-plus-blue {
    background: var(--accent3);
    color: #111;
  }

  .exercise-card.done .btn-plus-blue {
    background: var(--done-border);
  }

  .reset-btn {
    margin-top: 14px;
    width: 100%;
    padding: 10px;
    border-radius: 10px;
    border: none;
    background: #2a2e42;
    color: var(--muted);
    font-size: 13px;
    font-family: 'Nanum Gothic', sans-serif;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }

  .reset-btn:active { opacity: 0.7; }

  .all-done-banner {
    display: none;
    text-align: center;
    padding: 28px 20px;
    margin: 8px 0 0;
  }

  .all-done-banner.show {
    display: block;
  }

  .all-done-emoji {
    font-size: 64px;
    display: block;
    margin-bottom: 10px;
  }

  .all-done-text {
    font-family: 'Jua', sans-serif;
    font-size: 24px;
    color: var(--accent);
  }

  .all-done-sub {
    font-size: 14px;
    color: var(--muted);
    margin-top: 6px;
  }

  .reset-all-btn {
    margin-top: 20px;
    padding: 14px 32px;
    border-radius: 14px;
    border: none;
    background: #2a2e42;
    color: var(--muted);
    font-family: 'Jua', sans-serif;
    font-size: 16px;
    cursor: pointer;
  }

  .reset-all-btn:active { opacity: 0.7; }
</style>
</head>
<body>

<header>
  <div class="header-title">오늘의 운동 💪</div>
  <div class="header-date" id="headerDate"></div>
  <div class="progress-bar-wrap">
    <div class="progress-bar-fill" id="progressFill" style="width:0%"></div>
  </div>
  <div class="progress-label" id="progressLabel">0 / 5 완료</div>
</header>

<div class="container">

  <!-- 1. 팔굽혀펴기 -->
  <div class="exercise-card" id="card-0">
    <div class="exercise-header">
      <div class="exercise-emoji">🤸</div>
      <div class="exercise-info">
        <div class="exercise-name">팔굽혀펴기</div>
        <div class="exercise-unit">Push-up</div>
      </div>
      <div class="done-badge">✅</div>
    </div>
    <div class="counter-row">
      <button class="counter-btn btn-minus" onclick="changeCount(0, -1)">−</button>
      <span class="counter-value" id="val-0">0</span>
      <span class="unit-label">개</span>
      <button class="counter-btn btn-plus" onclick="changeCount(0, 1)">+</button>
    </div>
    <button class="reset-btn" onclick="resetItem(0)">↺ 초기화</button>
  </div>

  <!-- 2. 스쿼트 -->
  <div class="exercise-card" id="card-1">
    <div class="exercise-header">
      <div class="exercise-emoji">🦵</div>
      <div class="exercise-info">
        <div class="exercise-name">스쿼트</div>
        <div class="exercise-unit">Squat</div>
      </div>
      <div class="done-badge">✅</div>
    </div>
    <div class="counter-row">
      <button class="counter-btn btn-minus" onclick="changeCount(1, -1)">−</button>
      <span class="counter-value" id="val-1">0</span>
      <span class="unit-label">개</span>
      <button class="counter-btn btn-plus" onclick="changeCount(1, 1)">+</button>
    </div>
    <button class="reset-btn" onclick="resetItem(1)">↺ 초기화</button>
  </div>

  <!-- 3. 다리들기 -->
  <div class="exercise-card" id="card-2">
    <div class="exercise-header">
      <div class="exercise-emoji">🦶</div>
      <div class="exercise-info">
        <div class="exercise-name">다리들기</div>
        <div class="exercise-unit">Leg Raise</div>
      </div>
      <div class="done-badge">✅</div>
    </div>
    <div class="counter-row">
      <button class="counter-btn btn-minus" onclick="changeCount(2, -1)">−</button>
      <span class="counter-value" id="val-2">0</span>
      <span class="unit-label">개</span>
      <button class="counter-btn btn-plus" onclick="changeCount(2, 1)">+</button>
    </div>
    <button class="reset-btn" onclick="resetItem(2)">↺ 초기화</button>
  </div>

  <!-- 4. 슈퍼맨 -->
  <div class="exercise-card" id="card-3">
    <div class="exercise-header">
      <div class="exercise-emoji">🦸</div>
      <div class="exercise-info">
        <div class="exercise-name">슈퍼맨</div>
        <div class="exercise-unit">Superman</div>
      </div>
      <div class="done-badge">✅</div>
    </div>
    <div class="counter-row">
      <button class="counter-btn btn-minus" onclick="changeCount(3, -1)">−</button>
      <span class="counter-value" id="val-3">0</span>
      <span class="unit-label">개</span>
      <button class="counter-btn btn-plus" onclick="changeCount(3, 1)">+</button>
    </div>
    <button class="reset-btn" onclick="resetItem(3)">↺ 초기화</button>
  </div>

  <!-- 5. 매달리기 (초) -->
  <div class="exercise-card" id="card-4">
    <div class="exercise-header">
      <div class="exercise-emoji">🙌</div>
      <div class="exercise-info">
        <div class="exercise-name">매달리기</div>
        <div class="exercise-unit">Dead Hang</div>
      </div>
      <div class="done-badge">✅</div>
    </div>
    <div class="counter-row">
      <button class="counter-btn btn-minus" onclick="changeCount(4, -1)">−</button>
      <span class="timer-display" id="val-4">0</span>
      <span class="unit-label">초</span>
      <button class="counter-btn btn-plus-blue" onclick="changeCount(4, 1)">+</button>
    </div>
    <button class="reset-btn" onclick="resetItem(4)">↺ 초기화</button>
  </div>

  <div class="all-done-banner" id="allDoneBanner">
    <span class="all-done-emoji">🎉</span>
    <div class="all-done-text">오늘 운동 완료!</div>
    <div class="all-done-sub">최고야! 내일도 하자 💪</div>
    <button class="reset-all-btn" onclick="resetAll()">↺ 처음부터 다시</button>
  </div>

</div>

<script>
  // State: targets per exercise (0 = no target, just count)
  // Items: [pushup, squat, legraise, superman, hang]
  // "done" = value > 0
  const STORAGE_KEY = 'kids_routine_v1';

  let state = { values: [0, 0, 0, 0, 0], date: '' };

  function todayStr() {
    return new Date().toLocaleDateString('ko-KR', { year:'numeric', month:'long', day:'numeric', weekday:'long' });
  }

  function todayKey() {
    const d = new Date();
    return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;
  }

  function load() {
    try {
      const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
      if (saved.date === todayKey()) {
        state = saved;
      } else {
        state = { values: [0, 0, 0, 0, 0], date: todayKey() };
      }
    } catch(e) {
      state = { values: [0, 0, 0, 0, 0], date: todayKey() };
    }
    render();
  }

  function save() {
    state.date = todayKey();
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }

  function changeCount(idx, delta) {
    state.values[idx] = Math.max(0, state.values[idx] + delta);
    save();
    render();
  }

  function resetItem(idx) {
    state.values[idx] = 0;
    save();
    render();
  }

  function resetAll() {
    state.values = [0, 0, 0, 0, 0];
    save();
    render();
  }

  function render() {
    document.getElementById('headerDate').textContent = todayStr();

    let doneCount = 0;
    for (let i = 0; i < 5; i++) {
      const v = state.values[i];
      document.getElementById(`val-${i}`).textContent = v;
      const card = document.getElementById(`card-${i}`);
      if (v > 0) {
        card.classList.add('done');
        doneCount++;
      } else {
        card.classList.remove('done');
      }
    }

    const pct = Math.round((doneCount / 5) * 100);
    document.getElementById('progressFill').style.width = pct + '%';
    document.getElementById('progressLabel').textContent = `${doneCount} / 5 완료`;

    const banner = document.getElementById('allDoneBanner');
    if (doneCount === 5) {
      banner.classList.add('show');
    } else {
      banner.classList.remove('show');
    }
  }

  load();
</script>
</body>
</html>
